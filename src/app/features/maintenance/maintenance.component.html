<ion-header>
  <ion-toolbar>
    <ion-title>Maintenance Tasks</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form (ngSubmit)="addTask()" #taskForm="ngForm">
    <ion-card>
      <ion-card-header>
        <ion-card-title>Add New Task</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <ion-item>
          <ion-label position="floating">Description</ion-label>
          <ion-input type="text" [(ngModel)]="newTask.description" name="description" required></ion-input>
        </ion-item>

        <ion-item>
          <ion-label position="floating">Category</ion-label>
          <ion-input type="text" [(ngModel)]="newTask.category" name="category" required></ion-input>
        </ion-item>

        <ion-item>
          <ion-label position="floating">Reminder Date</ion-label>
          <ion-input type="date" [(ngModel)]="newTask.reminderDate" name="reminderDate" required></ion-input>
        </ion-item>

        <ion-item>
          <ion-label position="floating">Task Date</ion-label>
          <ion-input type="date" [(ngModel)]="newTask.date" name="date" required></ion-input>
        </ion-item>

        <ion-button expand="full" type="submit">Add Task</ion-button>
      </ion-card-content>
    </ion-card>
  </form>

  <ion-card class="task-list">
    <ion-card-header>
      <ion-card-title>Current Tasks</ion-card-title>
    </ion-card-header>
    <ion-list>
      <ion-item *ngFor="let task of maintenanceService.getTasks()">
        <ion-label>
          <h2>{{ task.description }}</h2>
          <h3>Category: {{ task.category }}</h3>
          <p>Due: {{ task.date | date: 'shortDate' }}</p>
        </ion-label>
      </ion-item>
    </ion-list>
  </ion-card>
</ion-content>
