<!-- src/app/features/settings/settings.component.html -->
<ion-header>
  <ion-toolbar>
    <ion-title>Settings</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item *ngFor="let category of categories">
      {{ category }}
    </ion-item>
  </ion-list>

  <ion-item>
    <ion-label position="floating">Add New Category</ion-label>
    <ion-input [(ngModel)]="newCategory" placeholder="Enter category name"></ion-input>
  </ion-item>

  <ion-button expand="full" (click)="addCategory()">Add Category</ion-button>
</ion-content>
