<!-- src/app/features/report/report.component.html -->
<ion-header>
  <ion-toolbar>
    <ion-title>Generate Report</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <form (ngSubmit)="generateReport()" #reportForm="ngForm">
    <ion-item>
      <ion-label>Start Date</ion-label>
      <ion-input type="date" [(ngModel)]="startDate" name="startDate" required></ion-input>
    </ion-item>
    <ion-item>
      <ion-label>End Date</ion-label>
      <ion-input type="date" [(ngModel)]="endDate" name="endDate" required></ion-input>
    </ion-item>
    <ion-button expand="full" type="submit">Generate Report</ion-button>
  </form>

  <div *ngIf="filteredTasks.length > 0">
    <h2>Filtered Tasks:</h2>
    <ion-list>
      <ion-item *ngFor="let task of filteredTasks">
        <ion-label>{{ task.description }} ({{ task.category }}) - {{ task.date | date }}</ion-label>
      </ion-item>
    </ion-list>
  </div>
</ion-content>
